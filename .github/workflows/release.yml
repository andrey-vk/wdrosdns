name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Validate source
        run: node scripts/validate-manifest.mjs --tag "${GITHUB_REF_NAME}"

      - name: Package extension
        run: |
          npm run build
          cd dist
          zip -r "../wdrosdns-${GITHUB_REF_NAME}.zip" wdrosdns

      - name: Validate package
        run: node scripts/validate-package.mjs "wdrosdns-${GITHUB_REF_NAME}.zip" --tag "${GITHUB_REF_NAME}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: wdrosdns-${{ github.ref_name }}.zip
          generate_release_notes: true
