name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run validate:manifest

      - name: Package and validate
        run: |
          npm run build
          cd dist && zip -qr ../wdrosdns-ci.zip wdrosdns && cd ..
          node scripts/validate-package.mjs wdrosdns-ci.zip
